AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  RestoreCheck - automated backup verification. On a schedule, a Step Functions
  workflow restores the latest RDS snapshot into a temporary instance, runs
  integrity checks against it, always deletes it, records the result and alerts
  on failure.

# ---------------------------------------------------------------------------
# Parameters: values supplied at deploy time, so one template serves both the
# LocalStack dev stack and the real AWS stack.
# ---------------------------------------------------------------------------
Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: dev = the Lambdas target LocalStack endpoints; prod = real AWS.

  SourceDbInstanceId:
    Type: String
    Description: Identifier of the RDS (PostgreSQL) instance whose snapshots are verified.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to restore temporary instances into (the account's default VPC is fine).

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets of that VPC, in different Availability Zones.

  DbName:
    Type: String
    Default: appdb
    Description: Database the checks connect to inside the restored instance.

  DbUser:
    Type: String
    Default: restorecheck_verifier
    AllowedPattern: "^[a-z_][a-z0-9_]*$"
    Description: >
      Read-only database user the checker logs in as with IAM authentication.
      It must exist in the source database with the rds_iam role granted.

  TempInstancePrefix:
    Type: String
    Default: restorecheck-tmp-
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}-$"
    Description: >
      Name prefix for the temporary restored instances. The IAM policy only allows
      restoring into / deleting instances whose name starts with this prefix.

  TempInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: Instance class for the temporary restored instance (keep it small).

  MaxRestoreMinutes:
    Type: Number
    Default: 60
    MinValue: 5
    Description: A restore still not available after this long is treated as an error.

  ScheduleExpression:
    Type: String
    Default: cron(0 2 * * ? *)
    Description: EventBridge schedule (UTC). Default is 02:00 UTC every day.

  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: DISABLED deploys the schedule but never fires it (manual runs only).

  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email address subscribed to failure alerts. Empty = no subscription.

  MetricNamespace:
    Type: String
    Default: RestoreCheck
    Description: CloudWatch namespace for custom metrics. The IAM policy is scoped to it.

  ReportRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Days to keep verification reports in S3 before they expire.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: Days to keep the Lambdas' CloudWatch logs.

Conditions:
  IsDev: !Equals [!Ref Stage, dev]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # -------------------------------------------------------------------------
  # Orchestration: EventBridge schedule -> Step Functions workflow
  # -------------------------------------------------------------------------
  # A real RDS restore often takes longer than Lambda's 15-minute limit, so no
  # single Lambda runs the whole pipeline. The workflow calls short Lambda steps
  # and waits between them; the wait itself costs nothing.
  VerificationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-verification"
      Type: STANDARD
      DefinitionUri: statemachine/restorecheck.asl.json
      DefinitionSubstitutions:
        VerifierFunctionArn: !GetAtt VerifierFunction.Arn
        CheckerFunctionArn: !GetAtt CheckerFunction.Arn
      # SAM policy templates: allow invoking exactly these two functions.
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref VerifierFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CheckerFunction
      Events:
        VerificationSchedule:
          # SAM expands this into an AWS::Events::Rule plus the IAM role that
          # lets EventBridge start an execution of this state machine.
          Type: Schedule
          Properties:
            Description: Triggers a RestoreCheck backup-verification run.
            Schedule: !Ref ScheduleExpression
            State: !Ref ScheduleState
            Input: '{"trigger": "schedule"}'

  # -------------------------------------------------------------------------
  # Verifier Lambda: every step that calls AWS APIs (outside the VPC)
  # -------------------------------------------------------------------------
  VerifierFunction:
    Type: AWS::Serverless::Function
    DependsOn: VerifierLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-verifier"
      Description: RestoreCheck pipeline steps - prepare, poll, teardown, record.
      CodeUri: src/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 120
      Role: !GetAtt VerifierRole.Arn
      Environment:
        Variables:
          RESTORECHECK_DEV: !If [IsDev, "true", "false"]
          SOURCE_DB_INSTANCE_ID: !Ref SourceDbInstanceId
          TEMP_INSTANCE_PREFIX: !Ref TempInstancePrefix
          TEMP_INSTANCE_CLASS: !Ref TempInstanceClass
          MAX_RESTORE_MINUTES: !Ref MaxRestoreMinutes
          RESTORE_SUBNET_GROUP: !Ref RestoreSubnetGroup
          RESTORE_SECURITY_GROUP_ID: !GetAtt RestoredDbSecurityGroup.GroupId
          RESULTS_TABLE: !Ref ResultsTable
          REPORTS_BUCKET: !Ref ReportsBucket
          ALERT_TOPIC_ARN: !Ref AlertTopic
          METRIC_NAMESPACE: !Ref MetricNamespace

  # Declared explicitly (instead of letting Lambda auto-create it) so the logs
  # expire and the role can be scoped to exactly this log group.
  VerifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-verifier"
      RetentionInDays: !Ref LogRetentionDays

  VerifierRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the RestoreCheck verifier Lambda.
      # Trust policy: WHO may assume this role (only the Lambda service).
      AssumeRolePolicyDocument:
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Service": "lambda.amazonaws.com" },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      # Permissions policy: WHAT the role may do. Only the custom policy below -
      # no AWS-managed policies, no wildcards on actions.
      ManagedPolicyArns:
        - !Ref VerifierPolicy

  # The custom JSON policy (course requirement). YAML is a superset of JSON, so the
  # document is written in plain IAM JSON; {"Fn::Sub": ...} is the long form of !Sub.
  VerifierPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Least-privilege permissions for the RestoreCheck verifier Lambda.
      PolicyDocument:
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "WriteOwnLogs",
              "Effect": "Allow",
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": { "Fn::GetAtt": ["VerifierLogGroup", "Arn"] }
            },
            {
              "Sid": "DiscoverSnapshotsAndInstances",
              "Effect": "Allow",
              "Action": ["rds:DescribeDBSnapshots", "rds:DescribeDBInstances"],
              "Resource": "*"
            },
            {
              "Sid": "RestoreSnapshotIntoTempInstance",
              "Effect": "Allow",
              "Action": "rds:RestoreDBInstanceFromDBSnapshot",
              "Resource": [
                { "Fn::Sub": "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${TempInstancePrefix}*" },
                { "Fn::Sub": "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:*" },
                { "Fn::Sub": "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:*" },
                { "Fn::Sub": "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:og:*" },
                { "Fn::Sub": "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:pg:*" }
              ]
            },
            {
              "Sid": "TagAndDeleteOnlyTempInstances",
              "Effect": "Allow",
              "Action": ["rds:AddTagsToResource", "rds:DeleteDBInstance"],
              "Resource": { "Fn::Sub": "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${TempInstancePrefix}*" }
            },
            {
              "Sid": "RecordResult",
              "Effect": "Allow",
              "Action": "dynamodb:PutItem",
              "Resource": { "Fn::GetAtt": ["ResultsTable", "Arn"] }
            },
            {
              "Sid": "WriteReport",
              "Effect": "Allow",
              "Action": "s3:PutObject",
              "Resource": { "Fn::Sub": "${ReportsBucket.Arn}/reports/*" }
            },
            {
              "Sid": "AlertOnFailure",
              "Effect": "Allow",
              "Action": "sns:Publish",
              "Resource": { "Ref": "AlertTopic" }
            },
            {
              "Sid": "PublishMetrics",
              "Effect": "Allow",
              "Action": "cloudwatch:PutMetricData",
              "Resource": "*",
              "Condition": {
                "StringEquals": { "cloudwatch:namespace": { "Ref": "MetricNamespace" } }
              }
            }
          ]
        }

  # -------------------------------------------------------------------------
  # Checker Lambda: runs the SQL checks from inside the VPC
  # -------------------------------------------------------------------------
  # Only this function is in the VPC, and it calls no AWS APIs (its IAM login
  # token is computed locally), so the VPC needs no NAT gateway or endpoints.
  CheckerFunction:
    Type: AWS::Serverless::Function
    DependsOn: CheckerLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-checker"
      Description: Connects to the restored database and runs the integrity checks.
      CodeUri: src/
      Handler: checker.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 120
      Role: !GetAtt CheckerRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt CheckerSecurityGroup.GroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser

  CheckerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-checker"
      RetentionInDays: !Ref LogRetentionDays

  CheckerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the RestoreCheck checker Lambda.
      AssumeRolePolicyDocument:
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Service": "lambda.amazonaws.com" },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      ManagedPolicyArns:
        - !Ref CheckerPolicy

  CheckerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Least-privilege permissions for the RestoreCheck checker Lambda.
      PolicyDocument:
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "WriteOwnLogs",
              "Effect": "Allow",
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": { "Fn::GetAtt": ["CheckerLogGroup", "Arn"] }
            },
            {
              "Sid": "AttachToVpc",
              "Effect": "Allow",
              "Action": [
                "ec2:CreateNetworkInterface",
                "ec2:DescribeNetworkInterfaces",
                "ec2:DescribeSubnets",
                "ec2:DeleteNetworkInterface",
                "ec2:AssignPrivateIpAddresses",
                "ec2:UnassignPrivateIpAddresses"
              ],
              "Resource": "*"
            },
            {
              "Sid": "LogInAsVerifierUserOnly",
              "Effect": "Allow",
              "Action": "rds-db:connect",
              "Resource": { "Fn::Sub": "arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/${DbUser}" }
            }
          ]
        }

  # -------------------------------------------------------------------------
  # Networking for the temporary instances
  # -------------------------------------------------------------------------
  CheckerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RestoreCheck checker Lambda (no inbound access)
      VpcId: !Ref VpcId

  # Temporary instances get only this group: PostgreSQL from the checker Lambda,
  # nothing else. They are also restored with PubliclyAccessible=false.
  RestoredDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RestoreCheck temporary instances - PostgreSQL from the checker only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: PostgreSQL from the checker Lambda
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt CheckerSecurityGroup.GroupId

  RestoreSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for RestoreCheck temporary instances
      SubnetIds: !Ref SubnetIds

  # -------------------------------------------------------------------------
  # Results: history (DynamoDB), detailed reports (S3), alerts (SNS)
  # -------------------------------------------------------------------------
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # On-demand: no capacity to provision, pay per request (~1 write per run).
      BillingMode: PAY_PER_REQUEST
      # Partition key = which database, sort key = when. "Latest N runs for db X"
      # is then a single Query, newest first.
      AttributeDefinitions:
        - AttributeName: source_db_id
          AttributeType: S
        - AttributeName: run_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: source_db_id
          KeyType: HASH
        - AttributeName: run_timestamp
          KeyType: RANGE

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      # No BucketName: CloudFormation generates a globally unique one.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldReports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: !Ref ReportRetentionDays

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: RestoreCheck alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # -------------------------------------------------------------------------
  # Dashboard: backup health and restore time (RTO) at a glance
  # -------------------------------------------------------------------------
  HealthDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-backup-health"
      DashboardBody: !Sub |
        {
          "start": "-P7D",
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Backup verified? (1 = passed, 0 = failed)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Minimum", "period": 300,
                "yAxis": { "left": { "min": 0, "max": 1 } },
                "metrics": [
                  [ "${MetricNamespace}", "VerificationSucceeded", "SourceDbId", "${SourceDbInstanceId}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Restore time in seconds (recovery time objective)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 300,
                "metrics": [
                  [ "${MetricNamespace}", "RestoreDurationSeconds", "SourceDbId", "${SourceDbInstanceId}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Verification runs (Step Functions executions)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/States", "ExecutionsSucceeded", "StateMachineArn", "${VerificationStateMachine}", { "label": "succeeded (PASSED)" } ],
                  [ "AWS/States", "ExecutionsFailed", "StateMachineArn", "${VerificationStateMachine}", { "label": "failed (FAILED / ERROR)" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda errors",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${VerifierFunction}", { "label": "verifier" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${CheckerFunction}", { "label": "checker" } ]
                ]
              }
            }
          ]
        }

Outputs:
  DashboardUrl:
    Description: CloudWatch dashboard with backup health and restore-time trends.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${AWS::StackName}-backup-health"
  StateMachineArn:
    Description: The verification workflow (start an execution to run a check now).
    Value: !Ref VerificationStateMachine
  VerifierFunctionName:
    Description: Lambda running the prepare / poll / teardown / record steps.
    Value: !Ref VerifierFunction
  CheckerFunctionName:
    Description: Lambda running the integrity checks inside the VPC.
    Value: !Ref CheckerFunction
  VerifierPolicyArn:
    Description: Custom least-privilege policy of the verifier Lambda.
    Value: !Ref VerifierPolicy
  CheckerPolicyArn:
    Description: Custom least-privilege policy of the checker Lambda.
    Value: !Ref CheckerPolicy
  ResultsTableName:
    Description: DynamoDB table holding pass/fail history.
    Value: !Ref ResultsTable
  ReportsBucketName:
    Description: S3 bucket holding detailed verification reports.
    Value: !Ref ReportsBucket
  AlertTopicArn:
    Description: SNS topic that receives failure alerts.
    Value: !Ref AlertTopic
